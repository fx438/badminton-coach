<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>发力教练</title>
<meta name="description" content="上传一段挥拍视频，获取 AI 发力改进建议" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#0E5C4A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F3EC;
    --surface: #FFFFFF;
    --surface-2: #EFEAE0;
    --ink: #16221D;
    --ink-dim: #5B6660;
    --primary: #0E5C4A;
    --primary-ink: #FFFFFF;
    --accent: #E2A33D;
    --border: #DCD5C4;
    --danger: #B4432E;
    --radius: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101613;
      --surface: #182019;
      --surface-2: #1F2822;
      --ink: #ECEAE0;
      --ink-dim: #97A199;
      --primary: #4FD8B3;
      --primary-ink: #0B1512;
      --accent: #F0B94D;
      --border: #2A342C;
      --danger: #F0897A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101613;
    --surface: #182019;
    --surface-2: #1F2822;
    --ink: #ECEAE0;
    --ink-dim: #97A199;
    --primary: #4FD8B3;
    --primary-ink: #0B1512;
    --accent: #F0B94D;
    --border: #2A342C;
    --danger: #F0897A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding-left: 16px;
    padding-right: 16px;
    padding-block: 0;
    max-width: 560px;
    margin: 0 auto;
  }
  h1, h2, h3 { font-family: "Big Shoulders Display", system-ui, sans-serif; text-wrap: balance; margin: 0; }
  .mono { font-family: "IBM Plex Mono", monospace; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 10;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 32px; height: 32px; }
  .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.3px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink); font-size: 18px;
  }

  main { padding-top: 20px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); display: flex; flex-direction: column; gap: 20px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    transition: border-color .15s ease;
  }
  .drop-zone:active { border-color: var(--primary); }
  .drop-zone .glyph { font-size: 34px; margin-bottom: 8px; }
  .drop-zone p { margin: 4px 0; color: var(--ink-dim); font-size: 14px; }
  .drop-zone .cta { color: var(--primary); font-weight: 600; }

  video.preview {
    width: 100%;
    border-radius: 12px;
    display: block;
    background: #000;
    max-width: 100%;
  }

  label.field-label {
    display: block; font-size: 13px; font-weight: 600; color: var(--ink-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  input[type="text"]:focus, input[type="password"]:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .btn {
    appearance: none; border: none; border-radius: 999px;
    padding: 14px 22px; font-size: 16px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
  }
  .btn-primary { background: var(--primary); color: var(--primary-ink); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); }

  .frames-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .frames-row img {
    width: 68px; height: 68px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--border); flex: 0 0 auto;
  }

  .status-line { display: flex; align-items: center; gap: 10px; color: var(--ink-dim); font-size: 14px; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--primary);
    animation: spin 0.8s linear infinite; flex: 0 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result h2 { font-size: 24px; margin-bottom: 4px; }
  .result .eyebrow { font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .result-body { margin-top: 14px; display: flex; flex-direction: column; gap: 14px; }
  .result-body h3 { font-size: 17px; margin-top: 4px; }
  .result-body p { margin: 0; line-height: 1.65; font-size: 15px; }
  .result-body ol, .result-body ul { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 15px; }
  .result-body li { margin-bottom: 6px; }
  .result-body strong { color: var(--primary); }
  .callout {
    background: var(--surface-2); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 12px 14px; font-size: 14px; color: var(--ink-dim); line-height: 1.6;
  }

  .error-box {
    border: 1px solid var(--danger); color: var(--danger);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; background: var(--surface);
  }

  dialog.settings {
    border: none; border-radius: var(--radius); padding: 0; width: min(420px, calc(100vw - 32px));
    background: var(--surface); color: var(--ink);
  }
  dialog.settings::backdrop { background: rgba(0,0,0,0.4); }
  .settings-inner { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .settings-inner h2 { font-size: 20px; }
  .settings-inner .hint { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .settings-actions { display: flex; gap: 10px; margin-top: 4px; }
  .settings-actions .btn { width: auto; flex: 1; }

  footer { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); color: var(--ink-dim); font-size: 12px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="icons/icon-192.png" alt="" />
    <h1>发力教练</h1>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="设置" type="button">⚙</button>
</header>

<main>

  <section class="card" id="uploadCard">
    <div class="drop-zone" id="dropZone">
      <div class="glyph">🏸</div>
      <p><span class="cta">选择一段挥拍视频</span></p>
      <p>建议 3–8 秒，包含引拍到随挥的完整过程</p>
    </div>
    <input type="file" id="videoInput" accept="video/*" hidden />
    <video class="preview" id="videoPreview" hidden controls playsinline></video>
  </section>

  <section class="card" id="targetCard" hidden>
    <label class="field-label" for="targetInput">分析对象（可选）</label>
    <input type="text" id="targetInput" placeholder="例如：黑色上衣的男生" />
  </section>

  <section id="framesSection" hidden>
    <label class="field-label">抽取的关键帧</label>
    <div class="frames-row" id="framesRow"></div>
  </section>

  <button class="btn btn-primary" id="analyzeBtn" disabled type="button">开始分析</button>

  <section class="card" id="statusCard" hidden>
    <div class="status-line">
      <div class="spinner"></div>
      <span id="statusText">正在请求 AI 教练…</span>
    </div>
  </section>

  <section id="errorSection" hidden></section>

  <section class="card result" id="resultCard" hidden>
    <div class="eyebrow">AI 发力分析</div>
    <h2 id="resultTitle">改进建议</h2>
    <div class="result-body" id="resultBody"></div>
  </section>

</main>

<footer>关键帧在你的手机本地生成；图片直接发送给 DeepSeek，不经过第三方服务器。</footer>

<dialog class="settings" id="settingsDialog">
  <div class="settings-inner">
    <h2>DeepSeek API Key</h2>
    <p class="hint">只保存在这台设备的浏览器本地存储中，不会上传到任何地方。去 platform.deepseek.com 可以申请自己的 Key。</p>
    <div>
      <label class="field-label" for="apiKeyInput">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
    </div>
    <div class="settings-actions">
      <button class="btn btn-ghost" id="settingsCancel" type="button">取消</button>
      <button class="btn btn-primary" id="settingsSave" type="button">保存</button>
    </div>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  const NUM_FRAMES = 5;
  const MODEL = "deepseek-flash";
  const API_URL = "https://api.deepseek.com/chat/completions";
  const STORAGE_KEY = "badminton_coach_deepseek_key";

  const dropZone = document.getElementById("dropZone");
  const videoInput = document.getElementById("videoInput");
  const videoPreview = document.getElementById("videoPreview");
  const targetCard = document.getElementById("targetCard");
  const targetInput = document.getElementById("targetInput");
  const framesSection = document.getElementById("framesSection");
  const framesRow = document.getElementById("framesRow");
  const analyzeBtn = document.getElementById("analyzeBtn");
  const statusCard = document.getElementById("statusCard");
  const statusText = document.getElementById("statusText");
  const errorSection = document.getElementById("errorSection");
  const resultCard = document.getElementById("resultCard");
  const resultBody = document.getElementById("resultBody");

  const settingsBtn = document.getElementById("settingsBtn");
  const settingsDialog = document.getElementById("settingsDialog");
  const apiKeyInput = document.getElementById("apiKeyInput");
  const settingsSave = document.getElementById("settingsSave");
  const settingsCancel = document.getElementById("settingsCancel");

  let frameDataUrls = [];

  function getApiKey() {
    try { return localStorage.getItem(STORAGE_KEY) || ""; }
    catch (e) { return ""; }
  }
  function setApiKey(key) {
    try { localStorage.setItem(STORAGE_KEY, key); } catch (e) {}
  }

  function openSettings() {
    apiKeyInput.value = getApiKey();
    settingsDialog.showModal();
  }
  settingsBtn.addEventListener("click", openSettings);
  settingsCancel.addEventListener("click", () => settingsDialog.close());
  settingsSave.addEventListener("click", () => {
    setApiKey(apiKeyInput.value.trim());
    settingsDialog.close();
  });

  dropZone.addEventListener("click", () => videoInput.click());
  videoInput.addEventListener("change", onVideoSelected);

  function resetOutputs() {
    framesSection.hidden = true;
    framesRow.innerHTML = "";
    setFramesStatus(null);
    frameDataUrls = [];
    errorSection.hidden = true;
    errorSection.innerHTML = "";
    resultCard.hidden = true;
    resultBody.innerHTML = "";
    analyzeBtn.disabled = true;
  }

  function onVideoSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    resetOutputs();

    const url = URL.createObjectURL(file);
    videoPreview.src = url;
    videoPreview.hidden = false;
    targetCard.hidden = false;

    framesSection.hidden = false;
    setFramesStatus("正在读取视频…");

    waitForDuration(videoPreview)
      .then((duration) => runExtraction(videoPreview, file, duration, NUM_FRAMES))
      .then((frames) => {
        frameDataUrls = frames;
        framesRow.innerHTML = "";
        frames.forEach((src) => {
          const img = document.createElement("img");
          img.src = src;
          framesRow.appendChild(img);
        });
        setFramesStatus(null);
        analyzeBtn.disabled = false;
      })
      .catch((err) => {
        framesSection.hidden = true;
        showError("抽帧失败：" + err.message);
      });
  }

  function setFramesStatus(text) {
    let el = document.getElementById("framesStatus");
    if (!text) {
      if (el) el.remove();
      return;
    }
    if (!el) {
      el = document.createElement("div");
      el.id = "framesStatus";
      el.className = "status-line";
      el.innerHTML = '<div class="spinner"></div><span></span>';
      framesRow.parentNode.insertBefore(el, framesRow);
    }
    el.querySelector("span").textContent = text;
  }

  // 只依赖容器层面的元数据（时长），不需要真正解码出画面，
  // HEVC 等浏览器无法软解的视频也能读到 duration。
  function waitForDuration(videoEl, timeoutMs) {
    timeoutMs = timeoutMs || 6000;
    return new Promise((resolve, reject) => {
      const start = Date.now();
      function check() {
        if (isFinite(videoEl.duration) && videoEl.duration > 0) {
          resolve(videoEl.duration);
          return;
        }
        if (Date.now() - start > timeoutMs) {
          reject(new Error("无法读取视频时长，文件可能已损坏"));
          return;
        }
        requestAnimationFrame(check);
      }
      if (videoEl.readyState >= 1) {
        check();
      } else {
        videoEl.addEventListener("loadedmetadata", check, { once: true });
      }
    });
  }

  // 抽帧总入口：优先用浏览器原生 <video>+canvas（H.264 等常见格式秒开）；
  // 如果浏览器解不出画面（常见于 HEVC/H.265，比如很多安卓机拍出来的视频），
  // 自动切换到内置的 ffmpeg.wasm 软件解码，不需要用户去改手机相机设置。
  async function runExtraction(videoEl, file, duration, n) {
    try {
      setFramesStatus("正在抽取关键帧…");
      return await extractFramesCanvas(videoEl, duration, n, 1500);
    } catch (canvasErr) {
      setFramesStatus("该视频编码格式手机浏览器无法直接解码，正在启用兼容模式（首次需下载解码引擎，可能需要十几秒）…");
      return await extractFramesFfmpeg(file, duration, n);
    }
  }

  // 方案一：浏览器原生解码，走 canvas 截帧，速度快。
  function extractFramesCanvas(videoEl, duration, n, readyTimeoutMs) {
    return new Promise((resolve, reject) => {
      const readyStart = Date.now();
      function waitDecodable() {
        if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
          doExtract();
          return;
        }
        if (Date.now() - readyStart > readyTimeoutMs) {
          reject(new Error("浏览器无法解码此视频"));
          return;
        }
        requestAnimationFrame(waitDecodable);
      }

      function doExtract() {
        const canvas = document.createElement("canvas");
        canvas.width = videoEl.videoWidth;
        canvas.height = videoEl.videoHeight;
        const ctx = canvas.getContext("2d");
        const times = [];
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? duration / 2 : (i * duration) / (n - 1);
          times.push(Math.min(t, Math.max(0, duration - 0.05)));
        }
        const results = [];
        let idx = 0;

        function seekNext() {
          if (idx >= times.length) {
            resolve(results);
            return;
          }
          videoEl.currentTime = times[idx];
        }

        function onSeeked() {
          try {
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            if (dataUrl === "data:,") throw new Error("画面为空");
            results.push(dataUrl);
          } catch (err) {
            videoEl.removeEventListener("seeked", onSeeked);
            reject(err);
            return;
          }
          idx++;
          seekNext();
        }

        videoEl.addEventListener("seeked", onSeeked);
        seekNext();
      }

      waitDecodable();
    });
  }

  // 方案二：ffmpeg.wasm 软件解码兜底，兼容浏览器原生不支持的编码格式。
  // 这几个文件是同源自托管的（vendor/），不走 CDN：@ffmpeg/ffmpeg 的
  // worker.js 内部还有相对路径 import（"./const.js" 等），托管在跨域 CDN
  // 上再用 blob URL 包一层会导致这些相对导入解析失败、静默卡死，所以把
  // ffmpeg.wasm 的产物整份复制到本站点，同源就没有这个问题。
  let ffmpegLoadPromise = null;
  async function getFFmpeg() {
    if (!ffmpegLoadPromise) {
      ffmpegLoadPromise = (async () => {
        const { FFmpeg } = await import("./vendor/ffmpeg/index.js");
        const ffmpeg = new FFmpeg();
        // 用绝对 URL：worker.js 内部会按它自己所在目录解析相对路径，
        // 传相对路径会拼出错误地址，必须传完整地址消除歧义。
        await ffmpeg.load({
          coreURL: new URL("vendor/core/ffmpeg-core.js", location.href).href,
          wasmURL: new URL("vendor/core/ffmpeg-core.wasm", location.href).href,
        });
        return ffmpeg;
      })();
    }
    return ffmpegLoadPromise;
  }

  // 注意：@ffmpeg/core 0.12.10 的 mjpeg 编码器处理 720p 以上画面会
  // "memory access out of bounds" 崩溃（HEVC 解码本身正常），所以这里
  // 让 ffmpeg 输出 PNG，再交给浏览器 canvas 转成 JPEG（PNG 所有浏览器都能解）。
  async function extractFramesFfmpeg(file, duration, n) {
    const { fetchFile } = await import("./vendor/util/index.js");
    let ffmpeg;
    try {
      ffmpeg = await getFFmpeg();
    } catch (err) {
      ffmpegLoadPromise = null;
      throw new Error("兼容模式解码引擎加载失败，请检查网络后重试");
    }

    const inputName = "input_" + Date.now() + ".mp4";
    await ffmpeg.writeFile(inputName, await fetchFile(file));

    // 片尾最后几十毫秒经常 seek 不到可输出的帧，给最后一帧留点余量
    const lastT = Math.max(0, duration - 0.3);
    const results = [];
    try {
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? duration / 2 : (i * lastT) / (n - 1);
        setFramesStatus(`兼容模式解码中…（${i + 1}/${n}）`);
        results.push(await grabFramePng(ffmpeg, inputName, t));
      }
    } catch (err) {
      // wasm 崩溃后实例不可再用，丢弃，下次重新加载
      try { ffmpeg.terminate(); } catch (_) {}
      ffmpegLoadPromise = null;
      throw new Error("兼容模式解码失败：" + (err && err.message ? err.message : String(err)));
    } finally {
      if (ffmpegLoadPromise) await ffmpeg.deleteFile(inputName).catch(() => {});
    }
    return results;
  }

  async function grabFramePng(ffmpeg, inputName, t) {
    const outName = "frame.png";
    // 取不到帧时往前退 0.2s 再试，最多 3 次
    for (let attempt = 0; attempt < 3; attempt++) {
      const tt = Math.max(0, t - attempt * 0.2);
      await ffmpeg.exec(["-ss", tt.toFixed(3), "-i", inputName, "-frames:v", "1", outName]);
      try {
        const data = await ffmpeg.readFile(outName);
        await ffmpeg.deleteFile(outName).catch(() => {});
        return await pngToJpegDataURL(new Blob([data.buffer], { type: "image/png" }));
      } catch (_) {
        // 没有输出文件，继续往前退
      }
    }
    throw new Error(`第 ${t.toFixed(1)} 秒附近取不到画面`);
  }

  async function pngToJpegDataURL(pngBlob) {
    const bitmap = await createImageBitmap(pngBlob);
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext("2d").drawImage(bitmap, 0, 0);
    bitmap.close();
    return canvas.toDataURL("image/jpeg", 0.85);
  }

  analyzeBtn.addEventListener("click", runAnalysis);

  async function runAnalysis() {
    const apiKey = getApiKey();
    if (!apiKey) {
      openSettings();
      return;
    }
    if (frameDataUrls.length === 0) return;

    errorSection.hidden = true;
    resultCard.hidden = true;
    statusCard.hidden = false;
    analyzeBtn.disabled = true;
    statusText.textContent = "正在请求 AI 教练…";

    try {
      const advice = await callDeepSeek(frameDataUrls, targetInput.value.trim(), apiKey);
      renderResult(advice);
    } catch (err) {
      showError(err.message || String(err));
    } finally {
      statusCard.hidden = true;
      analyzeBtn.disabled = false;
    }
  }

  function buildSystemPrompt(target) {
    const targetClause = target
      ? `画面中可能有多个人，请只分析【${target}】这一个人的动作，忽略画面里的其他人。\n`
      : "";
    return (
      "你是一位专业的羽毛球技术教练，擅长通过连续的挥拍照片分析发力链条" +
      "（蹬地转髋、转体带肩、大臂带小臂、手腕收压、球拍甩速）中的问题。\n" +
      targetClause +
      "输入是同一次挥拍动作按时间顺序抽取的若干张照片。请你：\n" +
      "1. 先说明这大致是哪个阶段/哪种击球，如果无法判断请说明原因；\n" +
      "2. 按时间顺序描述动作是否连贯，指出发力链条中断或代偿的环节；\n" +
      "3. 给出 3-5 条具体、可执行的改进建议，避免空泛的'注意发力'之类的话；\n" +
      "4. 如果照片质量、角度或数量不足以判断某个环节，明确说明，不要编造。\n" +
      "请用 Markdown 格式输出，使用 ## 小标题分段，改进建议用有序列表。"
    );
  }

  async function callDeepSeek(frames, target, apiKey) {
    const content = [
      {
        type: "text",
        text: target
          ? `以下是同一次羽毛球挥拍动作按时间顺序抽取的关键帧，请只分析【${target}】这个人的发力动作并给出改进建议。`
          : "以下是同一次羽毛球挥拍动作按时间顺序抽取的关键帧，请分析发力动作并给出改进建议。",
      },
    ];
    frames.forEach((dataUrl) => {
      content.push({ type: "image_url", image_url: { url: dataUrl } });
    });

    const payload = {
      model: MODEL,
      messages: [
        { role: "system", content: buildSystemPrompt(target) },
        { role: "user", content: content },
      ],
      stream: false,
    };

    let resp;
    try {
      resp = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + apiKey,
        },
        body: JSON.stringify(payload),
      });
    } catch (networkErr) {
      throw new Error("网络请求失败，请检查手机网络连接：" + networkErr.message);
    }

    if (!resp.ok) {
      let detail = "";
      try {
        const errJson = await resp.json();
        detail = errJson.error && errJson.error.message ? errJson.error.message : JSON.stringify(errJson);
      } catch (e) {
        detail = await resp.text();
      }
      if (resp.status === 401) {
        throw new Error("API Key 无效，请在设置里重新填写。");
      }
      throw new Error(`DeepSeek 返回错误 (${resp.status})：${detail}`);
    }

    const data = await resp.json();
    const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) throw new Error("DeepSeek 返回内容为空");
    return text;
  }

  // 极简 Markdown 渲染：## 标题、有序/无序列表、**加粗**、段落。
  // 按空行分块处理：一个编号项后面紧跟的说明段落（DeepSeek 常见输出格式）
  // 会并入同一个 <li>，而不是被空行打断导致编号重新从 1 开始。
  function inline(text) {
    return text
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  function renderMarkdown(md) {
    const blocks = md.replace(/\r\n/g, "\n").trim().split(/\n\s*\n/);
    let html = "";
    let listType = null; // 'ol' | 'ul' | null
    let liOpen = false;
    let lastWasListItem = false;

    function closeLi() {
      if (liOpen) { html += "</li>"; liOpen = false; }
    }
    function closeList() {
      closeLi();
      if (listType) { html += `</${listType}>`; listType = null; }
      lastWasListItem = false;
    }

    blocks.forEach((rawBlock) => {
      const block = rawBlock.trim();
      if (!block) return;

      const blockLines = block.split("\n").map((l) => l.trim()).filter(Boolean);
      const firstLine = blockLines[0];

      const h2 = firstLine.match(/^##\s+(.*)/);
      const h3 = firstLine.match(/^###\s+(.*)/);
      const ol = firstLine.match(/^\d+[\.\)]\s+(.*)/);
      const ul = firstLine.match(/^[-*]\s+(.*)/);

      if (h2 || h3) {
        closeList();
        html += `<h3>${inline((h2 || h3)[1])}</h3>`;
        return;
      }

      if (ol || ul) {
        const type = ol ? "ol" : "ul";
        const firstContent = (ol || ul)[1];
        if (listType !== type) { closeList(); html += `<${type}>`; listType = type; }
        else { closeLi(); }
        html += `<li>${inline(firstContent)}`;
        liOpen = true;
        // 同一块里，列表标记后紧跟（没有空行）的后续行，作为该项的延续文字
        for (let i = 1; i < blockLines.length; i++) {
          html += ` ${inline(blockLines[i])}`;
        }
        lastWasListItem = true;
        return;
      }

      // 普通段落块：如果上一块是列表项，说明这是它的补充说明，并入同一个 <li>
      const paragraphText = blockLines.join(" ");
      if (lastWasListItem && liOpen) {
        html += ` ${inline(paragraphText)}`;
      } else {
        closeList();
        html += `<p>${inline(paragraphText)}</p>`;
      }
    });
    closeList();
    return html;
  }

  function renderResult(markdown) {
    resultBody.innerHTML = renderMarkdown(markdown);
    resultCard.hidden = false;
    resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showError(message) {
    errorSection.hidden = false;
    errorSection.innerHTML = `<div class="error-box">${message}</div>`;
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
